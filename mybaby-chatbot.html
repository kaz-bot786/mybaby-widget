<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MyBaby Ultrasound Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato',sans-serif;font-weight:300;background:transparent;display:flex;align-items:flex-end;justify-content:flex-end;min-height:100vh;padding:16px}
#launcher{width:56px;height:56px;border-radius:50%;background:#287094;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(40,112,148,0.4);display:flex;align-items:center;justify-content:center;position:fixed;bottom:20px;right:20px;transition:transform 0.2s,box-shadow 0.2s;z-index:999}
#launcher:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(40,112,148,0.5)}
#launcher.open svg.chat-icon{display:none}
#launcher.open svg.close-icon{display:block!important}
#chat-window{position:fixed;bottom:88px;right:20px;width:340px;max-height:520px;background:#fff;border-radius:18px;box-shadow:0 8px 40px rgba(2,50,70,0.18);display:flex;flex-direction:column;overflow:hidden;z-index:998;opacity:0;transform:translateY(16px) scale(0.97);pointer-events:none;transition:opacity 0.25s,transform 0.25s}
#chat-window.open{opacity:1;transform:translateY(0) scale(1);pointer-events:all}
#chat-header{background:#287094;padding:14px 16px;display:flex;align-items:center;gap:10px}
#chat-header .avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
#chat-header .info .name{color:#fff;font-size:14px;font-weight:400}
#chat-header .info .status{color:rgba(255,255,255,0.7);font-size:11px;font-weight:300}
.online-dot{display:inline-block;width:7px;height:7px;background:#4ade80;border-radius:50%;margin-right:4px}
#messages{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
#messages::-webkit-scrollbar{width:4px}
#messages::-webkit-scrollbar-thumb{background:#d0e8f0;border-radius:2px}
.msg{max-width:82%;padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.6;font-weight:300;animation:msgIn 0.2s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.bot{background:#f0f7fa;color:#023246;border-bottom-left-radius:4px;align-self:flex-start}
.msg.user{background:#287094;color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.msg a{color:#287094;text-decoration:underline}
.msg.user a{color:#fff}
.typing{display:flex;gap:4px;padding:10px 12px;background:#f0f7fa;border-radius:14px;border-bottom-left-radius:4px;align-self:flex-start;width:52px}
.typing span{width:6px;height:6px;background:#287094;border-radius:50%;animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:0.2s}
.typing span:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
#quick-replies{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
.qr{padding:5px 11px;border:1.5px solid #287094;border-radius:100px;background:#fff;color:#287094;font-size:11px;font-weight:400;cursor:pointer;font-family:inherit;transition:all 0.15s;white-space:nowrap}
.qr:hover{background:#287094;color:#fff}
#input-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid #e8f0ec}
#user-input{flex:1;border:1.5px solid #e0eaee;border-radius:20px;padding:8px 14px;font-size:13px;font-family:inherit;font-weight:300;outline:none;color:#023246;transition:border 0.2s}
#user-input:focus{border-color:#287094}
#send-btn{width:34px;height:34px;border-radius:50%;background:#287094;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.2s}
#send-btn:hover{background:#1f5c7a}
#send-btn:disabled{background:#c0d8e4;cursor:not-allowed}
.powered{text-align:center;font-size:10px;color:#c0c0c0;padding:0 0 8px;font-weight:300}
</style>
</head>
<body>

<button id="launcher" onclick="toggleChat()" aria-label="Open chat">
  <svg class="chat-icon" width="24" height="24" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  <svg class="close-icon" style="display:none" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
</button>

<div id="chat-window">
  <div id="chat-header">
    <div class="avatar">🤰</div>
    <div class="info">
      <div class="name">MyBaby Assistant</div>
      <div class="status"><span class="online-dot"></span>Online now</div>
    </div>
  </div>
  <div id="messages"></div>
  <div id="quick-replies"></div>
  <div id="input-row">
    <input id="user-input" type="text" placeholder="Ask me anything…" onkeydown="if(event.key==='Enter')sendMessage()"/>
    <button id="send-btn" onclick="sendMessage()">
      <svg width="16" height="16" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <div class="powered">Powered by AI · MyBaby Ultrasound</div>
</div>

<script>
const ANTHROPIC_KEY = "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";
const WIX_API_KEY  = "IST.eyJraWQiOiJQb3pIX2FDMiIsImFsZyI6IlJTMjU2In0.eyJkYXRhIjoie1wiaWRcIjpcIjY2ZDYyNjEzLTY1ODQtNGMyZC1hYTIzLTA3MmM3ZmRhNDIwOVwiLFwiaWRlbnRpdHlcIjp7XCJ0eXBlXCI6XCJhcHBsaWNhdGlvblwiLFwiaWRcIjpcIjU2MTdmNTI1LTRkMGItNDg1Zi1hNzM2LTE2MWYwNzljY2Q3ZFwifSxcInRlbmFudFwiOntcInR5cGVcIjpcImFjY291bnRcIixcImlkXCI6XCIzOWEyNTBhMC1hNDg2LTRkYWEtOGIwNi02YjFiOWI2OTc2NjNcIn19IiwiaWF0IjoxNzc3ODA3ODAxfQ.D0vlLeXW9Ixq-9A13KgTAsT5SSlsq3rFkwdnLwbY66QVAyhSZcl-EhVOaeoZ6LeoHPYhJVpTPMmX2NlPE9-5rVf0dfFZ9A_mfbz2CUBQXIQEwcqraQ0WWLzneMuGXuSTPOeqlDAduOPWYtVPchm_3d5Id1Ir-yFLOMiHj_MGZunjcn9KgqbVKyLOrmzvohBVVVULCvyHSuxAcJ77sd0cVPkYh4QL2230gbKVMwOWlRmbLt3MpHYU2VjKLlaEMSNmYWoynC8akgB3bAnOlXTicVdDCulnZpFUcH6w4iSDHEARQNkLnFkkBy_mUHQttXOAa9HChgn5qprDyG8ubRYgEw";
const SITE_ID      = "5e8a071f-9e9a-498d-87ab-4a2cc314b404";

const SERVICES = {
  "early":     { id: "73b244aa-1eff-4f83-826b-2375812588b8", name: "Early Pregnancy Scan" },
  "wellbeing": { id: "0accf983-be32-48a4-9f92-58dde5228a33", name: "Wellbeing & Gender Reveal Scan" },
  "3d4d":      { id: "79add909-5c20-47c4-8569-0fbd97b52789", name: "3D/4D Live Scan" },
  "emergency": { id: "ec80d195-a675-46e1-b34c-9459ffeb3a08", name: "Emergency Pregnancy Scan" }
};

// Availability injected at page load from Wix — updated daily via GitHub Actions or manually
const AVAILABILITY = `CURRENT LIVE AVAILABILITY (updated Sunday 9 August 2026 at 07:42):

Early Pregnancy Scan (£65):
  - No availability found in the next 14 days. Please call to enquire.

Wellbeing & Gender Reveal (£75):
  - No availability found in the next 14 days. Please call to enquire.

3D/4D Live Scan (£95):
  - No availability found in the next 14 days. Please call to enquire.

Emergency Pregnancy Scan (£250):
  - Available evenings 7 days a week.
  - Must call/email at least 2 hours in advance.
  - Phone: 0127 642 3372 | Email: info@mybabyultrasound.co.uk
`;

const SYSTEM_PROMPT = `You are a friendly, warm assistant for MyBaby Ultrasound — a private CQC-registered pregnancy scan clinic in Camberley, Surrey. Your name is MyBaby Assistant.

CLINIC DETAILS:
- Address: Suite 2, Camberley House, Portesbury Road, Camberley, Surrey, GU15 3SZ
- Phone: 0127 642 3372
- Email: info@mybabyultrasound.co.uk
- Website: www.mybabyultrasound.co.uk
- Booking: www.mybabyultrasound.co.uk/our-services
- CQC registered, 7+ years clinical experience

OPENING HOURS:
- Standard scans (Early, Wellbeing, 3D/4D): Weekends only, 9am–6pm
- Emergency Pregnancy Scan: 7 days a week, evenings

SERVICES & PRICES:
1. Early Pregnancy Scan — £65 (from 6 weeks, 10–15 mins) — confirms heartbeat, dating, location
2. Wellbeing & Gender Reveal — £75 (from 16 weeks, 15–20 mins) — wellbeing check + gender on request
3. 3D/4D Live Scan — £95 (from 24 weeks, 20–30 mins) — real-time 3D/4D imaging + video clips
4. Emergency Pregnancy Scan — £250 (15 mins, evenings, 7 days) — cannot book online, call/email 2hrs+ in advance

AVAILABILITY CHECKING:
When a user asks about availability, slots, or wants to book, you have access to real-time availability data. If availability data is provided in the conversation prefixed with [AVAILABILITY], use it to give a specific helpful answer. Tell the user the next available slots and suggest they book at www.mybabyultrasound.co.uk/our-services

IMPORTANT:
- Ultrasound is safe — sound waves, not radiation
- Scans do NOT replace NHS scans
- Reassurance service only — concerns referred to NHS
- Gift vouchers: www.mybabyultrasound.co.uk/egift-card
- For medical concerns, recommend NHS midwife/GP

TONE: Warm, reassuring, professional. Short paragraphs, plain text only — no markdown, no asterisks, no bullets.

AVAILABILITY: When someone asks about availability, slots, or booking times, always give specific dates and times from the CURRENT LIVE AVAILABILITY data below. Be specific — name the dates and times. Always end with a link to book at www.mybabyultrasound.co.uk/our-services` + "\n\n" + AVAILABILITY;

let history = [];
let chatOpen = false;

// Availability is now baked into the system prompt above
async function fetchAvailability(serviceKey, days = 14) { return null; /*disabled*/
  const svc = SERVICES[serviceKey];
  if (!svc) return null;

  const now   = new Date();
  const later = new Date(now);
  later.setDate(now.getDate() + days);
  const fmt = d => d.toISOString().slice(0,10) + "T00:00:00";

  try {
    const res = await fetch(`https://www.wixapis.com/_api/service-availability/v2/time-slots`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": WIX_API_KEY,
        "wix-site-id": SITE_ID
      },
      body: JSON.stringify({
        serviceId: svc.id,
        fromLocalDate: fmt(now),
        toLocalDate: fmt(later),
        bookable: true,
        timeZone: "Europe/London",
        cursorPaging: { limit: 20 }
      })
    });
    const data = await res.json();
    const slots = data.timeSlots ?? [];

    // Group by date, pick first slot per day, return up to 5 days
    const byDay = {};
    slots.forEach(s => {
      if (!s.localStartDate) return;
      const day = s.localStartDate.slice(0,10);
      if (!byDay[day]) byDay[day] = [];
      byDay[day].push(s.localStartDate.slice(11,16));
    });

    const days = Object.keys(byDay).slice(0, 5);
    if (days.length === 0) return `No availability found for ${svc.name} in the next ${days} days.`;

    const lines = days.map(d => {
      const date = new Date(d + "T12:00:00");
      const label = date.toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long" });
      const times = byDay[d].slice(0,4).join(", ");
      return `${label}: ${times}`;
    });

    return `[AVAILABILITY] Next available slots for ${svc.name}:\n${lines.join("\n")}\nBook at: www.mybabyultrasound.co.uk/our-services`;
  } catch(e) {
    return null;
  }
}

// Detect which service a user is asking about
function detectService(text) {
  const t = text.toLowerCase();
  if (t.includes("early") || t.includes("heartbeat") || t.includes("6 week") || t.includes("first")) return "early";
  if (t.includes("gender") || t.includes("wellbeing") || t.includes("reveal")) return "wellbeing";
  if (t.includes("3d") || t.includes("4d") || t.includes("live scan")) return "3d4d";
  if (t.includes("emergency")) return "emergency";
  return null;
}

function isAvailabilityQuery(text) {
  const t = text.toLowerCase();
  return t.includes("availab") || t.includes("slot") || t.includes("appointment") ||
         t.includes("when can") || t.includes("book") || t.includes("next") ||
         t.includes("free") || t.includes("space") || t.includes("time");
}

// ── UI helpers ──────────────────────────────────────────────────────────────
function toggleChat() {
  chatOpen = !chatOpen;
  document.getElementById("chat-window").classList.toggle("open", chatOpen);
  document.getElementById("launcher").classList.toggle("open", chatOpen);
  if (chatOpen && history.length === 0) {
    setTimeout(() => addBotMsg("Hi there! 👋 I'm the MyBaby Ultrasound assistant. I can help with questions about our scans, prices, availability and bookings. What can I help you with today?"), 400);
    setTimeout(() => showQR(["Scan prices", "Check availability", "Book a scan", "Which scan do I need?"]), 1200);
  }
}

function showQR(opts) {
  const qr = document.getElementById("quick-replies");
  qr.innerHTML = "";
  opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "qr"; b.textContent = o;
    b.onclick = () => { qr.innerHTML = ""; handleMsg(o); };
    qr.appendChild(b);
  });
}

function addBotMsg(text) {
  const msgs = document.getElementById("messages");
  const d = document.createElement("div");
  d.className = "msg bot";
  d.innerHTML = text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>').replace(/\n/g, "<br>");
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

function addUserMsg(text) {
  const msgs = document.getElementById("messages");
  const d = document.createElement("div");
  d.className = "msg user"; d.textContent = text;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById("messages");
  const d = document.createElement("div");
  d.className = "typing"; d.id = "typing";
  d.innerHTML = "<span></span><span></span><span></span>";
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById("typing");
  if (t) t.remove();
}

// ── Main message handler ────────────────────────────────────────────────────
async function handleMsg(text) {
  addUserMsg(text);
  document.getElementById("quick-replies").innerHTML = "";
  document.getElementById("send-btn").disabled = true;
  showTyping();

  let availData = null;

  // If availability is being asked, fetch real data first
  if (isAvailabilityQuery(text)) {
    const svcKey = detectService(text) || "early"; // default to early if unspecified
    availData = await fetchAvailability(svcKey);
  }

  // Build messages for Claude
  const msgs = [...history, { role: "user", content: text }];
  if (availData) {
    msgs.push({ role: "user", content: availData });
  }

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": ANTHROPIC_KEY,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-5",
        max_tokens: 500,
        system: SYSTEM_PROMPT,
        messages: msgs
      })
    });

    const data = await res.json();
    removeTyping();

    if (data.error) throw new Error(data.error.message);

    const reply = (data.content?.find(b => b.type === "text")?.text || "").trim();
    history.push({ role: "user", content: text });
    history.push({ role: "assistant", content: reply });
    addBotMsg(reply);

    // Contextual quick replies
    const t = text.toLowerCase();
    if (t.includes("price") || t.includes("cost") || t.includes("how much")) {
      showQR(["Check availability", "Book a scan", "Which scan do I need?"]);
    } else if (t.includes("availab") || t.includes("slot") || t.includes("book")) {
      showQR(["Early Pregnancy Scan", "Gender Reveal Scan", "3D/4D Scan", "Emergency Scan"]);
    } else if (t.includes("emergency")) {
      showQR(["Call us", "Scan prices", "Other scans"]);
    } else {
      showQR(["Scan prices", "Check availability", "Book a scan"]);
    }

  } catch(e) {
    removeTyping();
    addBotMsg("Sorry, I had a technical issue. Please call us on 0127 642 3372 or email info@mybabyultrasound.co.uk and we'll be happy to help!");
  }

  document.getElementById("send-btn").disabled = false;
}

function sendMessage() {
  const input = document.getElementById("user-input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  handleMsg(text);
}
</script>
</body>
</html>
