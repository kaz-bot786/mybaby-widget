<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MyBaby Ultrasound – Review Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fff;font-family:'Lato',sans-serif;font-weight:300;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .step-card{animation:fadeUp 0.35s ease}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const SCAN_TYPES = [
  {id:"early",     label:"👶 Early Pregnancy Scan"},
  {id:"wellbeing", label:"💗 Wellbeing & Gender Reveal"},
  {id:"3d4d",      label:"🖼️ 3D/4D Live Scan"},
  {id:"emergency", label:"➕ Emergency Pregnancy Scan"},
];

const HIGHLIGHTS = {
  5:["The sonographer was so warm and caring","Felt completely at ease from the moment I arrived","The images were incredibly clear","Such a special, memorable experience","Clinic was spotlessly clean and welcoming","Explained everything clearly throughout","Would absolutely recommend to any mum-to-be","Worth every penny"],
  4:["Staff were friendly and professional","Good quality images","Felt reassured after the scan","Clean and comfortable environment","Appointment ran on time","Good value for money","Would recommend"],
  3:["Staff were polite","Scan itself was good","Waiting area was fine","Mostly as expected","Some room to improve"],
  2:["Wait was longer than expected","Could communicate better","Felt a bit rushed","Pricier than expected","Room for improvement"],
  1:["Very disappointing experience","Poor communication","Not what was advertised","Would not return"],
};

const STAR_LABELS = ["","Poor","Below Average","Average","Good","Excellent"];
const STAR_COLORS = ["","#cc3333","#cc7700","#b8a000","#287094","#287094"];
const STEPS = [
  {title:"How was your experience?",   sub:"How did we do?"},
  {title:"Which scan did you have?",   sub:"Which scan did you have?"},
  {title:"What made it special?",      sub:"Pick everything that applies"},
  {title:"Anything else to add?",      sub:"Optional — any specific details?"},
  {title:"Your review is ready ✨",    sub:"Ready to post on Trustpilot"},
];

function App() {
  const [step, setStep]         = React.useState(0);
  const [rating, setRating]     = React.useState(0);
  const [hover, setHover]       = React.useState(0);
  const [scanType, setScan]     = React.useState("");
  const [highlights, setHL]     = React.useState([]);
  const [details, setDetails]   = React.useState("");
  const [review, setReview]     = React.useState("");
  const [loading, setLoading]   = React.useState(false);
  const [copied, setCopied]     = React.useState(false);
  const reviewRef               = React.useRef(null);

  const ar = hover || rating;
  const sc = STAR_COLORS[ar] || "#d0c5b0";
  const toggleHL = h => setHL(p => p.includes(h) ? p.filter(x=>x!==h) : [...p,h]);
  const canNext = () => step===0?rating>0 : step===1?!!scanType : step===2?highlights.length>0 : true;

  const handleCopy = () => {
    const ta = reviewRef.current;
    if (ta) { ta.focus(); ta.select(); ta.setSelectionRange(0,99999); }
    try {
      if (document.execCommand("copy")) { setCopied(true); setTimeout(()=>setCopied(false),2500); return; }
    } catch(_) {}
    navigator.clipboard && navigator.clipboard.writeText(review)
      .then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),2500); })
      .catch(()=>{});
  };

  const generate = async () => {
    setLoading(true); setStep(4);
    // For 1-3 stars, skip AI and show manual input
    if (rating <= 3) {
      setReview("");
      setLoading(false);
      return;
    }
    const sl = SCAN_TYPES.find(s=>s.id===scanType)?.label || scanType;
    try {
      const prompt = `Write a genuine heartfelt Trustpilot review for MyBaby Ultrasound, a private baby scan clinic in Camberley Surrey.\nRating: ${rating}/5 (${STAR_LABELS[rating]})\nScan: ${sl}\nHighlights: ${highlights.join(", ")}\nDetails: ${details||"none"}\nRules: real human tone, 3-5 sentences, warm and personal, match rating sentiment, reference scan type, don't start with I, no cliches. Return ONLY the review text.`;
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": "%%ANTHROPIC_API_KEY%%",
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-5",
          max_tokens: 1000,
          messages: [{ role: "user", content: prompt }]
        })
      });
      const d = await r.json();
      if (d.error) throw new Error(d.error.message);
      setReview((d.content?.find(b=>b.type==="text")?.text||"").trim());
    } catch (e) { setReview("Something went wrong: " + e.message); }
    setLoading(false);
  };

  const handleNext = () => step===3 ? generate() : setStep(s=>s+1);
  const restart = () => { setStep(0);setRating(0);setHover(0);setScan("");setHL([]);setDetails("");setReview("");setCopied(false);setLoading(false); };

  return (
    <div style={{width:"100%",maxWidth:480,margin:"0 auto"}}>
      <div style={{textAlign:"center",marginBottom:10}}>
        <h2 style={{color:"#287094",fontSize:17,fontWeight:400,margin:"0 0 2px",lineHeight:1.3}}>Leave Us a Review</h2>
        <p style={{color:"#808080",fontSize:12,fontWeight:300}}>Share your experience — it takes less than a minute</p>
      </div>

      <div style={{display:"flex",gap:6,marginBottom:14,justifyContent:"center"}}>
        {STEPS.map((_,i)=>(
          <div key={i} style={{width:i===step?28:8,height:8,borderRadius:4,background:i<step?"#287094":i===step?"#6aafc8":"#d0e8f0",transition:"all 0.3s"}}/>
        ))}
      </div>

      <div className="step-card" style={{background:"#fff",borderRadius:20,padding:"16px 16px",boxShadow:"0 4px 24px rgba(2,52,38,0.08)",border:"1px solid #e8f0ec"}}>
        <h2 style={{color:"#023246",fontSize:17,fontWeight:400,margin:"0 0 2px"}}>{STEPS[step].title}</h2>
        <p style={{color:"#808080",fontSize:12,margin:"0 0 16px",fontWeight:300}}>{STEPS[step].sub}</p>

        {step===0 && (
          <div style={{textAlign:"center"}}>
            <div style={{display:"flex",gap:6,justifyContent:"center",marginBottom:14}}>
              {[1,2,3,4,5].map(s=>(
                <button key={s} onClick={()=>setRating(s)} onMouseEnter={()=>setHover(s)} onMouseLeave={()=>setHover(0)}
                  style={{background:"none",border:"none",cursor:"pointer",fontSize:34,color:s<=ar?sc:"#ddd",transform:s<=ar?"scale(1.1)":"scale(1)",transition:"all 0.15s"}}>★</button>
              ))}
            </div>
            {ar>0 && <div style={{display:"inline-block",padding:"5px 16px",background:`${sc}15`,borderRadius:100,color:sc,fontSize:12,fontWeight:400}}>{STAR_LABELS[ar]}</div>}
          </div>
        )}

        {step===1 && (
          <div style={{display:"flex",flexDirection:"column",gap:9}}>
            {SCAN_TYPES.map(s=>(
              <button key={s.id} onClick={()=>setScan(s.id)} style={{padding:"9px 14px",borderRadius:12,border:scanType===s.id?"1.5px solid #287094":"1.5px solid #dce8dc",background:scanType===s.id?"rgba(40,112,148,0.06)":"#fff",color:scanType===s.id?"#287094":"#4a4a4a",fontSize:13,textAlign:"left",cursor:"pointer",fontFamily:"inherit",fontWeight:scanType===s.id?400:300,transition:"all 0.15s"}}>{s.label}</button>
            ))}
          </div>
        )}

        {step===2 && (
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
            {(HIGHLIGHTS[rating]||HIGHLIGHTS[3]).map(h=>(
              <button key={h} onClick={()=>toggleHL(h)} style={{padding:"6px 12px",borderRadius:100,border:highlights.includes(h)?"1.5px solid #287094":"1.5px solid #ddd5c5",background:highlights.includes(h)?"rgba(40,112,148,0.08)":"#faf8f4",color:highlights.includes(h)?"#287094":"#5a5a5a",fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:highlights.includes(h)?400:300,transition:"all 0.15s"}}>
                {highlights.includes(h)?"✓ ":""}{h}
              </button>
            ))}
          </div>
        )}

        {step===3 && (
          <div>
            <textarea value={details} onChange={e=>setDetails(e.target.value)}
              placeholder="e.g. The sonographer Sarah made us feel so calm, we found out we're having a girl…"
              rows={3} style={{width:"100%",background:"#faf8f4",border:"1.5px solid #e0d8cc",borderRadius:10,color:"#023246",fontSize:14,padding:"10px 13px",outline:"none",resize:"none",fontFamily:"inherit",fontWeight:300,lineHeight:1.7}}/>
            <p style={{color:"#aaa",fontSize:12,marginTop:5,fontWeight:300}}>Completely optional — skip ahead if you'd prefer.</p>
          </div>
        )}

        {step===4 && (
          <div>
            {loading ? (
              <div style={{textAlign:"center",padding:"28px 0"}}>
                <div style={{width:34,height:34,border:"2.5px solid #e0d8cc",borderTop:"2.5px solid #287094",borderRadius:"50%",margin:"0 auto 14px",animation:"spin 0.8s linear infinite"}}/>
                <p style={{color:"#808080",fontSize:14,fontWeight:300}}>Writing your review…</p>
              </div>
            ) : rating <= 3 ? (
              <>
                <div style={{marginBottom:12}}>
                  {[1,2,3,4,5].map(s=><span key={s} style={{fontSize:20,color:s<=rating?STAR_COLORS[rating]:"#d0c5b0"}}>★</span>)}
                </div>
                <p style={{color:"#023246",fontSize:13,fontWeight:400,marginBottom:8}}>We're sorry to hear your experience wasn't perfect.</p>
                <p style={{color:"#808080",fontSize:12,fontWeight:300,marginBottom:12}}>Please share what happened so others know what to expect. Your honest feedback helps us improve.</p>
                <textarea
                  ref={reviewRef}
                  value={review}
                  onChange={e=>setReview(e.target.value)}
                  placeholder="Please describe your experience in your own words..."
                  rows={6}
                  style={{width:"100%",background:"#faf8f4",border:"1.5px solid #e0d8cc",borderRadius:12,padding:12,marginBottom:12,lineHeight:1.8,color:"#023246",fontSize:14,fontWeight:300,fontFamily:"inherit",resize:"none",outline:"none"}}
                />
                <div style={{display:"flex",gap:8,flexWrap:"nowrap"}}>
                  <button onClick={handleCopy} disabled={!review.trim()} style={{flex:1,padding:"8px 6px",background:!review.trim()?"#e8f0ec":copied?"rgba(40,112,148,0.08)":"#287094",border:copied?"1.5px solid #287094":"none",borderRadius:10,color:!review.trim()?"#aaa":copied?"#287094":"#fff",fontSize:12,fontWeight:400,cursor:!review.trim()?"not-allowed":"pointer",whiteSpace:"nowrap",fontFamily:"inherit",transition:"all 0.2s"}}>
                    {copied?"✓ Copied!":"Copy Review"}
                  </button>
                  <a href="https://www.trustpilot.com/review/mybabyultrasound.co.uk" target="_blank" rel="noopener noreferrer"
                    style={{flex:1,padding:"8px 6px",background:"#00b67a",borderRadius:10,color:"#fff",fontSize:12,fontWeight:400,textDecoration:"none",textAlign:"center",display:"flex",alignItems:"center",justifyContent:"center",gap:4,whiteSpace:"nowrap",fontFamily:"inherit"}}>
                    ★ Post on Trustpilot
                  </a>
                </div>
                <button onClick={restart} style={{width:"100%",marginTop:10,padding:7,background:"none",border:"none",color:"#aaa",fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:300}}>Start over</button>
              </>
            ) : (
              <>
                <div style={{marginBottom:8}}>
                  {[1,2,3,4,5].map(s=><span key={s} style={{fontSize:20,color:s<=rating?STAR_COLORS[rating]:"#d0c5b0"}}>★</span>)}
                </div>
                <textarea ref={reviewRef} readOnly value={review} rows={5}
                  style={{width:"100%",background:"#faf8f4",border:"1.5px solid #e0d8cc",borderRadius:12,padding:12,marginBottom:12,lineHeight:1.8,color:"#023246",fontSize:14,fontWeight:300,fontFamily:"inherit",resize:"none",outline:"none",cursor:"text"}}/>
                <div style={{display:"flex",gap:8,flexWrap:"nowrap"}}>
                  <button onClick={handleCopy} style={{flex:1,padding:"8px 6px",background:copied?"rgba(40,112,148,0.08)":"#287094",border:copied?"1.5px solid #287094":"none",borderRadius:10,color:copied?"#287094":"#fff",fontSize:12,fontWeight:400,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit",transition:"all 0.2s"}}>
                    {copied?"✓ Copied!":"Copy Review"}
                  </button>
                  <a href="https://www.trustpilot.com/review/mybabyultrasound.co.uk" target="_blank" rel="noopener noreferrer"
                    style={{flex:1,padding:"8px 6px",background:"#00b67a",borderRadius:10,color:"#fff",fontSize:12,fontWeight:400,textDecoration:"none",textAlign:"center",display:"flex",alignItems:"center",justifyContent:"center",gap:4,whiteSpace:"nowrap",fontFamily:"inherit"}}>
                    ★ Post on Trustpilot
                  </a>
                </div>
                <button onClick={restart} style={{width:"100%",marginTop:10,padding:7,background:"none",border:"none",color:"#aaa",fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:300}}>Start over</button>
              </>
            )}
          </div>
        )}

        {step<4 && (
        <div style={{display:"flex",gap:10,marginTop:16}}>
          {step>0 && <button onClick={()=>setStep(s=>s-1)} style={{padding:"10px 16px",background:"#fff",border:"1.5px solid #dce8dc",borderRadius:10,color:"#808080",fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>← Back</button>}
          <button onClick={handleNext} disabled={!canNext()} style={{flex:1,padding:13,background:canNext()?"#287094":"#e8f0ec",border:"none",borderRadius:10,color:canNext()?"#fff":"#aaa",fontSize:14,fontWeight:400,cursor:canNext()?"pointer":"not-allowed",fontFamily:"inherit",transition:"all 0.2s"}}>
            {step===3?"Generate My Review →":"Next →"}
          </button>
        </div>
      )}

      <p style={{textAlign:"center",color:"#c0c0c0",fontSize:11,marginTop:12,fontWeight:300}}>MyBaby Ultrasound · Camberley, Surrey · CQC Registered</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
